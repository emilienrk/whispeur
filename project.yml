name: Whispeur
options:
  bundleIdPrefix: com.whispeur
  deploymentTarget:
    macOS: "26.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Whispeur:
    type: application
    platform: macOS
    sources:
      - path: Whispeur
    info:
      path: Whispeur/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Whispeur a besoin du micro pour la dictée vocale."
        NSSpeechRecognitionUsageDescription: "Whispeur utilise la reconnaissance vocale."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "https://github.com/emilienrk/whispeur/releases/latest/download/appcast.xml"
        SUPublicEDKey: "+BIJxDTK42OgI/4W1HXnyo2OHMDPmswJ4kBAKbppgjQ="
        SUEnableAutomaticChecks: true
    preBuildScripts:
      - name: Generate EngineBuildInfo
        script: |
          "$SRCROOT/scripts/generate-engine-info.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Whispeur
        PRODUCT_MODULE_NAME: Whispeur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "56"
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "Whispeur/Whispeur.entitlements"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/build-whisper/src"
          - "$(SRCROOT)/build-whisper/ggml/src"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/whisper.cpp/include"
          - "$(SRCROOT)/whisper.cpp/ggml/include"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Whispeur/Bridge/WhisperBridge.h"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/build-whisper/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
          - "-lwhisper"
          - "-lggml"
          - "-lggml-base"
          - "-lggml-cpu"
          - "-lggml-metal"
          - "-lggml-blas"
          - "-lc++"
          - "-framework Accelerate"
          - "-framework Metal"
          - "-framework Foundation"
          - "-framework AVFoundation"
          - "-framework CoreAudio"
          - "-framework AppKit"
          - "-framework ApplicationServices"
          - "-framework UserNotifications"
          - "-framework ServiceManagement"
    dependencies:
      - package: Sparkle

  WhispeurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhispeurTests
      # Include only the files under test — app targets don't export Swift modules.
      - path: Whispeur/Models
      - path: Whispeur/Services/HistoryService.swift
      - path: Whispeur/Services/MicrophonePermissionManager.swift
      - path: Whispeur/Services/RecordingCoordinator.swift
      - path: Whispeur/Services/AudioCaptureService.swift
      - path: Whispeur/Services/ClipboardService.swift
      - path: Whispeur/Services/WhisperService.swift
      - path: Whispeur/Services/HotkeyManager.swift
      - path: Whispeur/Services/MediaPlaybackController.swift
      - path: Whispeur/Services/AudioProcessProbe.swift
      - path: Whispeur/Bridge
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: WhispeurTests
        PRODUCT_MODULE_NAME: WhispeurTests
        ALWAYS_SEARCH_USER_PATHS: "NO"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/build-whisper/src"
          - "$(SRCROOT)/build-whisper/ggml/src"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/whisper.cpp/include"
          - "$(SRCROOT)/whisper.cpp/ggml/include"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Whispeur/Bridge/WhisperBridge.h"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/build-whisper/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-metal"
          - "-L$(SRCROOT)/build-whisper/ggml/src/ggml-blas"
          - "-lwhisper"
          - "-lggml"
          - "-lggml-base"
          - "-lggml-cpu"
          - "-lggml-metal"
          - "-lggml-blas"
          - "-lc++"
          - "-framework Accelerate"
          - "-framework Metal"
          - "-framework Foundation"
          - "-framework AVFoundation"
          - "-framework CoreAudio"
          - "-framework AppKit"
          - "-framework ApplicationServices"
          - "-framework UserNotifications"
          - "-framework ServiceManagement"
    dependencies: []
